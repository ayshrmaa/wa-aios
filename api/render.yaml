services:
  - type: web
    name: wa-aios-api
    runtime: node
    plan: starter
    buildCommand: cd api && npm ci
    startCommand: cd api && npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wa-aios-db
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      # Bookings/availability use one shared Google Calendar
      # (tenants.adapter_config.sharedCalendarId = "primary"). The three
      # GOOGLE_OAUTH_* values are entered in the Render dashboard (sync: false);
      # the API refuses to boot in google mode without them.
      - key: CALENDAR_PROVIDER
        value: google
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: MIGRATE_SEED
        value: true
      - key: RETELL_WEBHOOK_SECRET
        generateValue: true
      - key: DASHBOARD_API_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: true
      - key: RATE_LIMIT_MAX
        value: 120
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000

databases:
  - name: wa-aios-db
    plan: free
